<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Whore Image Generator</title>
    <style>
        body {
            background: #0c0c0c;
            color: #ffebf0;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
        }
        h1 {
            color: #e11d48;
            margin-bottom: 20px;
        }
        p {
            color: #ffa8ba;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        a {
            color: #ff477e;
            text-decoration: none;
            border: 2px solid #e11d48;
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            transition: all 0.3s;
        }
        a:hover {
            background: rgba(225, 29, 72, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You're Offline</h1>
        <p>The Whore Image Generator requires an internet connection to load fonts and external resources. Please check your connection and try again.</p>
        <a href="/">Return to App</a>
    </div>
</body>
</html>
